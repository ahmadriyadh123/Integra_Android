name: Deploy MWD backend

on:
  push:
    branches:
      - main
    paths:
      - "middleware-with-database/**"
      - ".github/workflows/deploy-mwd.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mwd-public-deployment
  cancel-in-progress: false

jobs:
  test-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: middleware-with-database
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-asyncio

      - name: Validate backend and run tests
        working-directory: middleware-with-database
        env:
          ODOO_HOST: 127.0.0.1
          DB_USER: ci
          DB_PASSWORD: ci-only-placeholder
          JWT_SECRET_KEY: ci-only-not-for-production-mwd-test-key
        run: |
          python -m compileall -q app
          python -m pytest -q

      - name: Verify deployment secrets
        run: |
          test -n "$DEPLOY_HOST" || { echo "Missing DEPLOY_HOST secret"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing DEPLOY_USER secret"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }
          test -n "$DEPLOY_KNOWN_HOSTS" || { echo "Missing DEPLOY_KNOWN_HOSTS secret"; exit 1; }
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo "DEPLOY_HOST must be a hostname only"; exit 1; }
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || { echo "DEPLOY_USER must be a valid SSH username"; exit 1; }

      - name: Configure verified SSH access
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/mwd_deploy"
          chmod 600 "$HOME/.ssh/mwd_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            echo "Host mwd-public"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile $HOME/.ssh/mwd_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile $HOME/.ssh/known_hosts"
          } >> "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh mwd-public '
            command -v rsync &&
            command -v curl &&
            test -x /srv/developer/mwd/.venv/bin/pip &&
            systemctl --user is-active mwd-api
          '
          if ! ssh mwd-public 'command -v soffice >/dev/null 2>&1 || command -v libreoffice >/dev/null 2>&1'; then
            echo "::warning::LibreOffice is missing on the server. Ask the server administrator to install libreoffice-writer; PDF generation will fail until then."
          fi

      - name: Package backend source
        run: |
          tar -czf "$RUNNER_TEMP/mwd-source.tar.gz" \
            --exclude=.env \
            --exclude=.venv \
            --exclude=venv \
            --exclude=.git \
            --exclude=__pycache__ \
            --exclude=.pytest_cache \
            -C middleware-with-database .
          echo "REMOTE_ARCHIVE=mwd-source-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload and deploy backend
        run: |
          scp "$RUNNER_TEMP/mwd-source.tar.gz" "mwd-public:$REMOTE_ARCHIVE"
          ssh mwd-public bash -s -- "$REMOTE_ARCHIVE" <<'REMOTE'
          set -euo pipefail

          archive="$1"
          app_dir="/srv/developer/mwd"
          backup_dir="$HOME/mwd-deploy-backups"
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          backup="$backup_dir/source-$timestamp-${archive#mwd-source-}"
          stage="$(mktemp -d "$HOME/mwd-stage.XXXXXX")"
          rollback_stage=""

          cleanup() {
            rm -rf -- "$stage"
            if [ -n "$rollback_stage" ]; then
              rm -rf -- "$rollback_stage"
            fi
            rm -f -- "$HOME/$archive"
          }
          trap cleanup EXIT

          mkdir -p "$backup_dir"
          tar -czf "$backup" \
            --exclude=.env \
            --exclude=.venv \
            --exclude=venv \
            --exclude=.git \
            --exclude=__pycache__ \
            --exclude=.pytest_cache \
            -C "$app_dir" .
          tar -xzf "$HOME/$archive" -C "$stage"

          if ! (
            set -e
            rsync -a --delete \
              --exclude='/.env' \
              --exclude='/.venv/' \
              "$stage/" "$app_dir/"
            "$app_dir/.venv/bin/pip" install -r "$app_dir/requirements.txt"
            "$app_dir/.venv/bin/pip" check
            "$app_dir/.venv/bin/python" -m compileall -q "$app_dir/app"
            systemctl --user restart mwd-api

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 5 \
                http://127.0.0.1:8000/ >/dev/null; then
                exit 0
              fi
              sleep 2
            done
            echo "Backend did not pass its local HTTP health check."
            exit 1
          ); then
            echo "Deployment failed; restoring the previous backend source."
            rollback_stage="$(mktemp -d "$HOME/mwd-rollback.XXXXXX")"
            tar -xzf "$backup" -C "$rollback_stage"
            rsync -a --delete \
              --exclude='/.env' \
              --exclude='/.venv/' \
              "$rollback_stage/" "$app_dir/"
            "$app_dir/.venv/bin/pip" install -r "$app_dir/requirements.txt"
            systemctl --user restart mwd-api
            exit 1
          fi

          echo "Backend source deployed successfully; backup: $backup"
          REMOTE

      - name: Verify public endpoint
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 \
            "https://$DEPLOY_HOST/mobile-api/" >/dev/null
